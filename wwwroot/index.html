<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Typing Practice</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TypingWebApp2.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        window.setTheme = (t) => document.documentElement.setAttribute('data-theme', t);
        window.getHiScore = (k) => { const v = localStorage.getItem('hs_' + k); return v ? parseInt(v) : 0; };
        window.setHiScore = (k, s) => {
            const prev = parseInt(localStorage.getItem('hs_' + k) || '0');
            if (s > prev) { localStorage.setItem('hs_' + k, s); return true; }
            return false;
        };
        document.documentElement.setAttribute('data-theme', 'dark');
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
